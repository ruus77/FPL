[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'fpl_project'
version = '0.1.0'
description = 'Projekt do analizy danych FPL'
requires-python = '>=3.9'
dependencies = ['pandas', 'python-dotenv', 'pyarrow']

[tool.setuptools.packages.find]
where = ['src']